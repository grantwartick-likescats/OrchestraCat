<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎻 Orchestra Cat Metronome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #3e2723, #1b0f0a);
      color: #fff8e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .stage-card {
      background-color: #fffdf7;
      color: #212121;
      width: 100%;
      max-width: 460px;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #d4af37;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 24px;
      color: #3e2723;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 13px;
      color: #795548;
      margin-top: 2px;
    }

    .beat-dots {
      display: flex;
      gap: 12px;
      margin: 12px 0;
      height: 20px;
      align-items: center;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #e0e0e0;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }

    .dot.active {
      background-color: #ff9800;
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.7);
    }

    .dot.active.accent {
      background-color: #d32f2f;
      transform: scale(1.45);
      box-shadow: 0 0 12px rgba(211, 47, 47, 0.8);
    }

    .cat-stage {
      width: 280px;
      height: 210px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 6px 0 14px 0;
    }

    #cat-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cat-bounce {
      transform: translateY(-6px) scale(1.02);
    }

    #cat-body-group {
      transition: transform 0.08s ease-out;
      transform-origin: center bottom;
    }

    #bow-group {
      transition: transform 0.09s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 185px 115px;
    }

    #left-paw {
      transition: transform 0.08s ease;
    }

    .note-particle {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
      animation: floatNote 0.8s ease-out forwards;
    }

    @keyframes floatNote {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-45px) scale(1.2); }
    }

    .bpm-box {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .bpm-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #8d6e63;
      background-color: #efebe9;
      color: #3e2723;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .bpm-btn:active {
      background-color: #d7ccc8;
      transform: scale(0.95);
    }

    .bpm-value {
      font-size: 38px;
      font-weight: 800;
      color: #3e2723;
      min-width: 90px;
      text-align: center;
    }

    .bpm-label {
      font-size: 12px;
      font-weight: bold;
      color: #8d6e63;
      text-transform: uppercase;
      display: block;
      margin-top: -4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #d4af37;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .settings-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 18px;
    }

    .setting-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-group label {
      font-size: 11px;
      font-weight: bold;
      color: #6d4c41;
      text-transform: uppercase;
    }

    select {
      padding: 8px 10px;
      border-radius: 12px;
      border: 2px solid #d7ccc8;
      background-color: #fafafa;
      font-weight: bold;
      color: #3e2723;
      font-size: 13px;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .play-btn {
      flex: 2;
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.35);
    }

    .play-btn.playing {
      background-color: #c62828;
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.35);
    }

    .tap-btn {
      flex: 1;
      background-color: #ffb300;
      color: #3e2723;
      border: none;
      padding: 14px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 179, 0, 0.3);
    }

    .tap-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="stage-card">
    <div class="header">
      <h1>🎻 Maestro Bongo Cat</h1>
      <p>Orchestra Violin Metronome</p>
    </div>

    <div class="beat-dots" id="beat-dots"></div>

    <div class="cat-stage" id="cat-stage">
      <svg id="cat-svg" viewBox="0 0 300 220">
        <!-- Music Stand -->
        <line x1="50" y1="120" x2="50" y2="210" stroke="#424242" stroke-width="4" stroke-linecap="round"/>
        <polygon points="22,95 78,108 72,135 16,122" fill="#fffde7" stroke="#424242" stroke-width="3"/>
        <line x1="26" y1="108" x2="66" y2="117" stroke="#9e9e9e" stroke-width="2"/>
        <line x1="24" y1="116" x2="64" y2="125" stroke="#9e9e9e" stroke-width="2"/>

        <!-- Cat Body & Head -->
        <g id="cat-body-group">
          <polygon points="105,65 112,25 138,52" fill="#ffffff" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
          <polygon points="112,58 116,35 131,52" fill="#f8bbd0"/>
          <polygon points="195,65 188,25 162,52" fill="#ffffff" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
          <polygon points="188,58 184,35 169,52" fill="#f8bbd0"/>

          <path d="M 90,175 C 88,110 100,50 150,50 C 200,50 212,110 210,175 Z" fill="#ffffff" stroke="#212121" stroke-width="4"/>

          <circle cx="130" cy="82" r="5" fill="#212121"/>
          <circle cx="170" cy="82" r="5" fill="#212121"/>
          <circle cx="128" cy="80" r="1.8" fill="#ffffff"/>
          <circle cx="168" cy="80" r="1.8" fill="#ffffff"/>

          <ellipse cx="116" cy="91" rx="6" ry="3.5" fill="#f48fb1" opacity="0.7"/>
          <ellipse cx="184" cy="91" rx="6" ry="3.5" fill="#f48fb1" opacity="0.7"/>

          <path d="M 142,91 Q 146,96 150,91 Q 154,96 158,91" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>

          <polygon points="150,114 134,106 134,122" fill="#d32f2f" stroke="#212121" stroke-width="2.5" stroke-linejoin="round"/>
          <polygon points="150,114 166,106 166,122" fill="#d32f2f" stroke="#212121" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="150" cy="114" r="4" fill="#b71c1c" stroke="#212121" stroke-width="2"/>
        </g>

        <!-- Violin -->
        <g id="violin-group">
          <line x1="125" y1="115" x2="72" y2="108" stroke="#4e342e" stroke-width="6" stroke-linecap="round"/>
          <circle cx="69" cy="108" r="5" fill="#6d4c41" stroke="#212121" stroke-width="2"/>
          <ellipse cx="128" cy="116" rx="22" ry="14" transform="rotate(8 128 116)" fill="#b85d19" stroke="#212121" stroke-width="3"/>
          <ellipse cx="110" cy="114" rx="16" ry="11" transform="rotate(8 110 114)" fill="#b85d19" stroke="#212121" stroke-width="3"/>
          <rect x="108" y="105" width="22" height="19" transform="rotate(8 118 114)" fill="#b85d19"/>
          <ellipse cx="141" cy="118" rx="6" ry="4" fill="#212121"/>
          <line x1="118" y1="108" x2="116" y2="122" stroke="#ffe0b2" stroke-width="2"/>
          <line x1="140" y1="117" x2="73" y2="108" stroke="#fff8e1" stroke-width="1"/>
        </g>

        <!-- Left Paw -->
        <g id="left-paw">
          <path d="M 98,125 C 85,125 82,106 94,104 C 103,103 106,115 104,123" fill="#ffffff" stroke="#212121" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Right Bow Arm (Moves on every beep) -->
        <g id="bow-group">
          <line x1="185" y1="122" x2="95" y2="92" stroke="#5d4037" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="182" y1="125" x2="98" y2="96" stroke="#eeeeee" stroke-width="1.5"/>
          <path d="M 192,135 C 175,135 172,115 186,113 C 198,112 202,126 198,135" fill="#ffffff" stroke="#212121" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <line x1="15" y1="175" x2="285" y2="175" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
        <rect x="25" y="178" width="250" height="28" rx="6" fill="#5d4037" stroke="#212121" stroke-width="3"/>
      </svg>
    </div>

    <div class="bpm-box">
      <button class="bpm-btn" onclick="changeBpm(-5)">−</button>
      <div>
        <div class="bpm-value" id="bpm-display">120</div>
        <span class="bpm-label" style="text-align:center;">BPM</span>
      </div>
      <button class="bpm-btn" onclick="changeBpm(5)">+</button>
    </div>

    <input type="range" id="bpm-slider" min="40" max="220" value="120" oninput="setBpm(this.value)">

    <div class="settings-row">
      <div class="setting-group">
        <label for="beats-select">Beats / Measure</label>
        <select id="beats-select" onchange="updateBeatsPerMeasure(this.value)">
          <option value="4" selected>4 / 4 (Standard)</option>
          <option value="3">3 / 4 (Waltz)</option>
          <option value="2">2 / 4 (March)</option>
          <option value="1">1 / 4 (No Accent)</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="sound-select">Beep Sound</label>
        <select id="sound-select">
          <option value="violin" selected>🎻 Violin Tone</option>
          <option value="click">🪵 Woodblock</option>
        </select>
      </div>
    </div>

    <div class="controls-row">
      <button class="play-btn" id="play-btn" onclick="toggleMetronome()">▶ Start Metronome</button>
      <button class="tap-btn" onclick="tapTempo()">👆 Tap</button>
    </div>
  </div>

  <script>
    let bpm = 120;
    let beatsPerMeasure = 4;
    let currentBeat = 0;
    let isPlaying = false;
    let timerId = null;
    let bowUp = false;
    let audioCtx = null;
    let tapTimes = [];

    const NOTE_EMOJIS = ['🎵', '🎶', '🎼', '🎻'];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(isAccent) {
      initAudio();
      const soundType = document.getElementById('sound-select').value;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (soundType === 'violin') {
        osc.type = 'sawtooth';
        const freq = isAccent ? 880 : 659.25;
        osc.frequency.setValueAtTime(freq, now);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1800, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
      } else {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isAccent ? 1050 : 780, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
      }

      osc.start(now);
      osc.stop(now + 0.18);
    }

    function animateCatViolin(isAccent) {
      const bodyGroup = document.getElementById('cat-body-group');
      const bowGroup = document.getElementById('bow-group');
      const leftPaw = document.getElementById('left-paw');
      const stage = document.getElementById('cat-stage');

      bowUp = !bowUp;
      if (bowUp) {
        bowGroup.style.transform = 'translate(-14px, -12px) rotate(12deg)';
        leftPaw.style.transform = 'translateX(-3px)';
      } else {
        bowGroup.style.transform = 'translate(10px, 8px) rotate(-8deg)';
        leftPaw.style.transform = 'translateX(2px)';
      }

      bodyGroup.classList.add('cat-bounce');
      setTimeout(() => {
        bodyGroup.classList.remove('cat-bounce');
      }, 90);

      const note = document.createElement('div');
      note.className = 'note-particle';
      note.textContent = isAccent ? '🎼' : NOTE_EMOJIS[Math.floor(Math.random() * 3)];
      note.style.left = (75 + Math.random() * 50) + 'px';
      note.style.top = (65 + Math.random() * 20) + 'px';
      stage.appendChild(note);

      setTimeout(() => {
        note.remove();
      }, 800);
    }

    function renderBeatDots() {
      const container = document.getElementById('beat-dots');
      container.innerHTML = '';
      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.id = `beat-dot-${i}`;
        container.appendChild(dot);
      }
    }

    function highlightDot(beatIndex) {
      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.getElementById(`beat-dot-${i}`);
        if (dot) {
          dot.classList.remove('active', 'accent');
          if (i === beatIndex) {
            dot.classList.add('active');
            if (i === 0 && beatsPerMeasure > 1) {
              dot.classList.add('accent');
            }
          }
        }
      }
    }

    function tick() {
      const isAccent = (currentBeat === 0 && beatsPerMeasure > 1);
      playBeep(isAccent);
      animateCatViolin(isAccent);
      highlightDot(currentBeat);

      currentBeat = (currentBeat + 1) % beatsPerMeasure;
    }

    function startMetronome() {
      initAudio();
      isPlaying = true;
      currentBeat = 0;
      const btn = document.getElementById('play-btn');
      btn.textContent = '⏹ Stop Metronome';
      btn.classList.add('playing');

      tick();
      const intervalMs = (60 / bpm) * 1000;
      timerId = setInterval(tick, intervalMs);
    }

    function stopMetronome() {
      isPlaying = false;
      clearInterval(timerId);
      timerId = null;

      const btn = document.getElementById('play-btn');
      btn.textContent = '▶ Start Metronome';
      btn.classList.remove('playing');

      highlightDot(-1);
      document.getElementById('bow-group').style.transform = 'translate(0, 0) rotate(0deg)';
    }

    function toggleMetronome() {
      if (isPlaying) {
        stopMetronome();
      } else {
        startMetronome();
      }
    }

    function setBpm(newBpm) {
      bpm = Math.max(40, Math.min(220, parseInt(newBpm, 10) || 120));
      document.getElementById('bpm-display').textContent = bpm;
      document.getElementById('bpm-slider').value = bpm;

      if (isPlaying) {
        clearInterval(timerId);
        const intervalMs = (60 / bpm) * 1000;
        timerId = setInterval(tick, intervalMs);
      }
    }

    function changeBpm(delta) {
      setBpm(bpm + delta);
    }

    function updateBeatsPerMeasure(val) {
      beatsPerMeasure = parseInt(val, 10);
      currentBeat = 0;
      renderBeatDots();
    }

    function tapTempo() {
      const now = Date.now();
      if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) {
        tapTimes = [];
      }
      tapTimes.push(now);

      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const calculatedBpm = Math.round(60000 / avgMs);
        setBpm(calculatedBpm);
      }
    }

    renderBeatDots();
  </script>
</body>
</html>
