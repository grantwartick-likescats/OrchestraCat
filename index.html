<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎼 Maestro Catfolter's Orchestra Metronome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #2c1810, #120906);
      color: #fff8e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .stage-card {
      background-color: #fffdf7;
      color: #212121;
      width: 100%;
      max-width: 480px;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #d4af37;
    }

    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 24px;
      color: #3e2723;
      letter-spacing: 0.4px;
    }

    .header p {
      font-size: 13px;
      color: #795548;
      margin-top: 2px;
      font-weight: 600;
    }

    .beat-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
      min-height: 22px;
      align-items: center;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #e0e0e0;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }

    .dot.active {
      background-color: #ff9800;
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.7);
    }

    .dot.active.accent {
      background-color: #d32f2f;
      transform: scale(1.45);
      box-shadow: 0 0 12px rgba(211, 47, 47, 0.85);
    }

    .cat-stage {
      width: 300px;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0 12px 0;
    }

    #cat-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cat-bounce {
      transform: translateY(-6px) scale(1.02);
    }

    #cat-body-group {
      transition: transform 0.08s ease-out;
      transform-origin: center bottom;
    }

    #baton-arm-group {
      transition: transform 0.1s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 185px 125px;
    }

    #left-paw {
      transition: transform 0.1s ease;
      transform-origin: 112px 125px;
    }

    .note-particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: floatNote 0.8s ease-out forwards;
    }

    @keyframes floatNote {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-45px) scale(1.2); }
    }

    .bpm-box {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 10px;
    }

    .bpm-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #8d6e63;
      background-color: #efebe9;
      color: #3e2723;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .bpm-btn:active {
      background-color: #d7ccc8;
      transform: scale(0.95);
    }

    .bpm-value {
      font-size: 40px;
      font-weight: 800;
      color: #3e2723;
      min-width: 100px;
      text-align: center;
    }

    .bpm-label {
      font-size: 12px;
      font-weight: bold;
      color: #8d6e63;
      text-transform: uppercase;
      display: block;
      margin-top: -4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #d4af37;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .settings-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 18px;
    }

    .setting-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-group label {
      font-size: 11px;
      font-weight: bold;
      color: #6d4c41;
      text-transform: uppercase;
    }

    select {
      padding: 9px 10px;
      border-radius: 12px;
      border: 2px solid #d7ccc8;
      background-color: #fafafa;
      font-weight: bold;
      color: #3e2723;
      font-size: 13px;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      width: 100%;
    }

    .play-btn {
      width: 100%;
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.35);
      transition: background-color 0.15s ease;
    }

    .play-btn.playing {
      background-color: #c62828;
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.35);
    }
  </style>
</head>
<body>

  <div class="stage-card">
    <div class="header">
      <h1>🎼 Maestro Catfolter</h1>
      <p>Symphony Conductor Metronome</p>
    </div>

    <div class="beat-dots" id="beat-dots"></div>

    <div class="cat-stage" id="cat-stage">
      <svg id="cat-svg" viewBox="0 0 300 220">
        <!-- Maestro Catfolter Body & Tuxedo -->
        <g id="cat-body-group">
          <!-- Left Ear -->
          <polygon points="105,65 112,25 138,52" fill="#ffffff" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
          <polygon points="112,58 116,35 131,52" fill="#f8bbd0"/>

          <!-- Right Ear -->
          <polygon points="195,65 188,25 162,52" fill="#ffffff" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
          <polygon points="188,58 184,35 169,52" fill="#f8bbd0"/>

          <!-- Head & Upper Fur -->
          <path d="M 90,175 C 88,110 100,50 150,50 C 200,50 212,110 210,175 Z" fill="#ffffff" stroke="#212121" stroke-width="4"/>

          <!-- Conductor Tuxedo Jacket -->
          <path d="M 92,175 C 93,135 105,112 132,112 L 150,148 L 168,112 C 195,112 207,135 208,175 Z" fill="#212121" stroke="#212121" stroke-width="3"/>
          <!-- White Shirt Front -->
          <polygon points="132,112 168,112 150,152" fill="#ffffff"/>
          <!-- Shirt Buttons -->
          <circle cx="150" cy="128" r="2" fill="#212121"/>
          <circle cx="150" cy="138" r="2" fill="#212121"/>

          <!-- Eyes -->
          <circle cx="130" cy="82" r="5" fill="#212121"/>
          <circle cx="170" cy="82" r="5" fill="#212121"/>
          <circle cx="128" cy="80" r="1.8" fill="#ffffff"/>
          <circle cx="168" cy="80" r="1.8" fill="#ffffff"/>

          <!-- Cheeks -->
          <ellipse cx="116" cy="91" rx="6" ry="3.5" fill="#f48fb1" opacity="0.7"/>
          <ellipse cx="184" cy="91" rx="6" ry="3.5" fill="#f48fb1" opacity="0.7"/>

          <!-- Cute Cat Mouth -->
          <path d="M 142,91 Q 146,96 150,91 Q 154,96 158,91" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>

          <!-- Fancy Red Conductor Bowtie -->
          <polygon points="150,113 135,105 135,121" fill="#d32f2f" stroke="#212121" stroke-width="2.5" stroke-linejoin="round"/>
          <polygon points="150,113 165,105 165,121" fill="#d32f2f" stroke="#212121" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="150" cy="113" r="4" fill="#b71c1c" stroke="#212121" stroke-width="2"/>
        </g>

        <!-- Left Paw (Expressive Conductor Hand) -->
        <g id="left-paw">
          <path d="M 112,135 C 95,135 92,115 106,113 C 118,112 122,126 118,135" fill="#ffffff" stroke="#212121" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Right Paw + Conductor Baton -->
        <g id="baton-arm-group">
          <!-- Wooden Baton Handle -->
          <line x1="190" y1="120" x2="245" y2="62" stroke="#fff8e1" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="186" y1="124" x2="196" y2="114" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
          <!-- Right Paw gripping baton -->
          <path d="M 192,135 C 175,135 172,115 186,113 C 198,112 202,126 198,135" fill="#ffffff" stroke="#212121" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Conductor Podium / Music Stand in Front -->
        <line x1="150" y1="168" x2="150" y2="212" stroke="#424242" stroke-width="6" stroke-linecap="round"/>
        <polygon points="85,152 215,152 205,176 95,176" fill="#5d4037" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
        <!-- Sheet Music Page -->
        <polygon points="105,147 195,147 190,168 110,168" fill="#fffde7" stroke="#212121" stroke-width="2"/>
        <line x1="118" y1="154" x2="144" y2="154" stroke="#9e9e9e" stroke-width="2"/>
        <line x1="156" y1="154" x2="182" y2="154" stroke="#9e9e9e" stroke-width="2"/>
        <line x1="116" y1="160" x2="144" y2="160" stroke="#9e9e9e" stroke-width="2"/>
        <line x1="156" y1="160" x2="184" y2="160" stroke="#9e9e9e" stroke-width="2"/>
      </svg>
    </div>

    <!-- BPM Controls (20 to 300 BPM) -->
    <div class="bpm-box">
      <button class="bpm-btn" onclick="changeBpm(-5)">−</button>
      <div>
        <div class="bpm-value" id="bpm-display">120</div>
        <span class="bpm-label" style="text-align:center;">BPM</span>
      </div>
      <button class="bpm-btn" onclick="changeBpm(5)">+</button>
    </div>

    <input type="range" id="bpm-slider" min="20" max="300" value="120" oninput="setBpm(this.value)">

    <!-- Time Signatures & 4 String Pluck Instruments -->
    <div class="settings-row">
      <div class="setting-group">
        <label for="time-sig-select">Time Signature</label>
        <select id="time-sig-select" onchange="updateTimeSignature(this.value)">
          <option value="1/4">1 / 4 (No Accent)</option>
          <option value="2/4">2 / 4 (March)</option>
          <option value="3/4">3 / 4 (Waltz)</option>
          <option value="4/4" selected>4 / 4 (Common)</option>
          <option value="5/4">5 / 4 (Irregular)</option>
          <option value="6/8">6 / 8 (Compound Duple)</option>
          <option value="7/8">7 / 8 (Asymmetric)</option>
          <option value="9/8">9 / 8 (Compound Triple)</option>
          <option value="12/8">12 / 8 (Compound Quad)</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="sound-select">String Pluck (Pizzicato)</label>
        <select id="sound-select">
          <option value="violin" selected>🎻 Violin Pluck</option>
          <option value="viola">🎻 Viola Pluck</option>
          <option value="cello">🎻 Cello Pluck</option>
          <option value="bass">🎻 Bass Pluck</option>
        </select>
      </div>
    </div>

    <div class="controls-row">
      <button class="play-btn" id="play-btn" onclick="toggleMetronome()">▶ Start Conducting</button>
    </div>
  </div>

  <script>
    let bpm = 120;
    let beatsPerMeasure = 4;
    let currentBeat = 0;
    let isPlaying = false;
    let timerId = null;
    let audioCtx = null;

    const NOTE_EMOJIS = ['🎵', '🎶', '🎼'];

    const INSTRUMENT_FREQS = {
      violin: { accent: 659.25, regular: 440.00, filterFreq: 2400, decay: 0.22 },
      viola:  { accent: 440.00, regular: 293.66, filterFreq: 1700, decay: 0.26 },
      cello:  { accent: 220.00, regular: 146.83, filterFreq: 1100, decay: 0.34 },
      bass:   { accent: 110.00, regular: 73.42,  filterFreq: 650,  decay: 0.45 }
    };

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPluck(isAccent) {
      initAudio();
      const instKey = document.getElementById('sound-select').value;
      const config = INSTRUMENT_FREQS[instKey] || INSTRUMENT_FREQS.violin;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      const freq = isAccent ? config.accent : config.regular;

      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(config.filterFreq * 1.6, now);
      filter.frequency.exponentialRampToValueAtTime(config.filterFreq * 0.35, now + config.decay);

      const peakGain = instKey === 'bass' ? 0.55 : (instKey === 'cello' ? 0.42 : 0.32);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, now + config.decay);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + config.decay + 0.03);
      osc2.stop(now + config.decay + 0.03);
    }

    function animateConductor(beatIndex, isAccent) {
      const bodyGroup = document.getElementById('cat-body-group');
      const batonArm = document.getElementById('baton-arm-group');
      const leftPaw = document.getElementById('left-paw');
      const stage = document.getElementById('cat-stage');

      if (beatIndex === 0) {
        batonArm.style.transform = 'translate(0px, 14px) rotate(28deg)';
        leftPaw.style.transform = 'translate(0px, 8px) rotate(-15deg)';
      } else if (beatIndex === beatsPerMeasure - 1 && beatsPerMeasure > 1) {
        batonArm.style.transform = 'translate(-6px, -16px) rotate(-25deg)';
        leftPaw.style.transform = 'translate(4px, -10px) rotate(15deg)';
      } else if (beatIndex % 2 === 1) {
        batonArm.style.transform = 'translate(-18px, 4px) rotate(-14deg)';
        leftPaw.style.transform = 'translate(-6px, -2px) rotate(-8deg)';
      } else {
        batonArm.style.transform = 'translate(14px, 2px) rotate(18deg)';
        leftPaw.style.transform = 'translate(8px, -4px) rotate(12deg)';
      }

      bodyGroup.classList.add('cat-bounce');
      setTimeout(() => {
        bodyGroup.classList.remove('cat-bounce');
      }, 90);

      const note = document.createElement('div');
      note.className = 'note-particle';
      note.textContent = isAccent ? '🎼' : NOTE_EMOJIS[Math.floor(Math.random() * NOTE_EMOJIS.length)];
      note.style.left = (195 + Math.random() * 55) + 'px';
      note.style.top = (45 + Math.random() * 30) + 'px';
      stage.appendChild(note);

      setTimeout(() => {
        note.remove();
      }, 800);
    }

    function renderBeatDots() {
      const container = document.getElementById('beat-dots');
      container.innerHTML = '';
      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.id = `beat-dot-${i}`;
        container.appendChild(dot);
      }
    }

    function highlightDot(beatIndex) {
      for (let i = 0; i < beatsPerMeasure; i++) {
        const dot = document.getElementById(`beat-dot-${i}`);
        if (dot) {
          dot.classList.remove('active', 'accent');
          if (i === beatIndex) {
            dot.classList.add('active');
            if (i === 0 && beatsPerMeasure > 1) {
              dot.classList.add('accent');
            }
          }
        }
      }
    }

    function tick() {
      const isAccent = (currentBeat === 0 && beatsPerMeasure > 1);
      playPluck(isAccent);
      animateConductor(currentBeat, isAccent);
      highlightDot(currentBeat);

      currentBeat = (currentBeat + 1) % beatsPerMeasure;
    }

    function startMetronome() {
      initAudio();
      isPlaying = true;
      currentBeat = 0;
      const btn = document.getElementById('play-btn');
      btn.textContent = '⏹ Stop Conducting';
      btn.classList.add('playing');

      tick();
      const intervalMs = (60 / bpm) * 1000;
      timerId = setInterval(tick, intervalMs);
    }

    function stopMetronome() {
      isPlaying = false;
      clearInterval(timerId);
      timerId = null;

      const btn = document.getElementById('play-btn');
      btn.textContent = '▶ Start Conducting';
      btn.classList.remove('playing');

      highlightDot(-1);
      document.getElementById('baton-arm-group').style.transform = 'translate(0, 0) rotate(0deg)';
      document.getElementById('left-paw').style.transform = 'translate(0, 0) rotate(0deg)';
    }

    function toggleMetronome() {
      if (isPlaying) {
        stopMetronome();
      } else {
        startMetronome();
      }
    }

    function setBpm(newBpm) {
      bpm = Math.max(20, Math.min(300, parseInt(newBpm, 10) || 120));
      document.getElementById('bpm-display').textContent = bpm;
      document.getElementById('bpm-slider').value = bpm;

      if (isPlaying) {
        clearInterval(timerId);
        const intervalMs = (60 / bpm) * 1000;
        timerId = setInterval(tick, intervalMs);
      }
    }

    function changeBpm(delta) {
      setBpm(bpm + delta);
    }

    function updateTimeSignature(sig) {
      const numerator = parseInt(sig.split('/')[0], 10);
      beatsPerMeasure = numerator;
      currentBeat = 0;
      renderBeatDots();
    }

    renderBeatDots();
  </script>
</body>
</html>
